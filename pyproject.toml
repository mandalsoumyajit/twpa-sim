[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twpa-sim"
version = "0.9.0"
description = "Traveling-wave and resonant parametric amplifier circuit, gain, and noise models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
layout = ["klayout>=0.30,<0.31"]

[project.urls]
Homepage = "https://github.com/mandalsoumyajit/twpa-sim"
Documentation = "https://github.com/mandalsoumyajit/twpa-sim/blob/main/docs/README.md"
Issues = "https://github.com/mandalsoumyajit/twpa-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"twpa.layout" = ["processes/*.json", "decks/*.drc", "decks/*.py"]
"twpa.em" = ["stacks/*.json"]
